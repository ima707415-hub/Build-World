name: BuildWorld Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" build/BuildWorld.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildWorld-Android
          path: build/BuildWorld.apk
